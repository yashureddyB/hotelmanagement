name: Spring Boot CI
on:
  push:
    branches:
    - develop
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build Project
      run: mvn clean package -DskipTests
